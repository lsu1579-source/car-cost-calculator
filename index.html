<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Car Cost Calculator</title>
</head>
<body>
  <h1>Car Cost Calculator</h1>
  <p>자동차를 보유하는 데 드는 월간·연간 비용을 계산합니다.</p>

  <!-- 입력 폼: 비용 항목별로 fieldset으로 묶었습니다. -->
  <form id="cost-form">
    <fieldset>
      <legend>주유</legend>
      <label for="fuelPrice">유가 (원/L)</label>
      <input type="number" id="fuelPrice" value="1700">

      <label for="fuelEfficiency">연비 (km/L)</label>
      <input type="number" id="fuelEfficiency" value="12" step="any">

      <label for="monthlyKm">월 주행거리 (km)</label>
      <input type="number" id="monthlyKm" value="1000">
    </fieldset>

    <fieldset>
      <legend>보험 · 세금 · 주차 · 정비</legend>
      <label for="insuranceYearly">연간 보험료 (원)</label>
      <input type="number" id="insuranceYearly" value="900000">

      <label for="carTaxYearly">연간 자동차세 (원)</label>
      <input type="number" id="carTaxYearly" value="300000">

      <label for="parkingMonthly">월 주차비 (원)</label>
      <input type="number" id="parkingMonthly" value="100000">

      <label for="maintenanceYearly">연간 정비비 (원)</label>
      <input type="number" id="maintenanceYearly" value="600000">
    </fieldset>

    <fieldset>
      <legend>감가상각</legend>
      <label for="purchasePrice">구입 가격 (원)</label>
      <input type="number" id="purchasePrice" value="40000000">

      <label for="currentValue">현재 예상 차량가치 (원)</label>
      <input type="number" id="currentValue" value="36000000">

      <label for="monthsOwned">현재까지 보유한 기간 (개월)</label>
      <input type="number" id="monthsOwned" value="6">
    </fieldset>

    <!-- type="button": 클릭해도 페이지가 새로고침되지 않도록 합니다. -->
    <button type="button" id="calculate-button">계산하기</button>
  </form>

  <!-- 결과 영역: 계산 결과는 이후 단계에서 script.js가 채웁니다. -->
  <section id="results">
    <h2>계산 결과</h2>
    <div id="results-content"></div>
  </section>

  <script src="script.js"></script>
</body>
</html>
